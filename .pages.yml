{
  "media": {
    "input": "media",
    "output": "media",
    "extensions": [
      "jpg",
      "jpeg",
      "png",
      "webp",
      "svg"
    ],
    "rename": "safe"
  },
  "content": [
    {
      "name": "download-page",
      "label": "다운로드 페이지 꾸미기",
      "type": "file",
      "path": "site.json",
      "format": "json",
      "operations": {
        "create": false,
        "rename": false,
        "delete": false
      },
      "fields": [
        {
          "name": "image",
          "label": "가운데 사진",
          "type": "image",
          "description": "사진을 선택하거나 새로 올려주세요. 세로 사진을 권장합니다.",
          "options": {
            "extensions": [
              "jpg",
              "jpeg",
              "png",
              "webp",
              "svg"
            ]
          }
        },
        {
          "name": "brandTitle",
          "label": "맨 위 제목",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "\\S",
            "message": "제목을 입력해 주세요."
          },
          "options": {
            "maxlength": 100
          }
        },
        {
          "name": "brandSubtitle",
          "label": "제목 아래 문구",
          "type": "string",
          "options": {
            "maxlength": 150
          }
        },
        {
          "name": "imageAlt",
          "label": "사진 설명",
          "type": "string",
          "description": "사진을 볼 수 없는 분에게 읽어주는 설명입니다.",
          "options": {
            "maxlength": 200
          }
        },
        {
          "name": "notice",
          "label": "분홍색 안내 상자 문구",
          "type": "text",
          "description": "Enter를 누르면 줄이 바뀝니다. 모두 지우면 안내 상자가 사라집니다.",
          "options": {
            "maxlength": 600
          }
        },
        {
          "name": "photoButtonText",
          "label": "파란색 버튼 글자",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "\\S",
            "message": "버튼 글자를 입력해 주세요."
          },
          "description": "사진 주소는 고객의 QR코드에 맞춰 자동으로 연결됩니다.",
          "options": {
            "maxlength": 100
          }
        },
        {
          "name": "bookingButtonText",
          "label": "초록색 버튼 글자",
          "type": "string",
          "required": true,
          "pattern": {
            "regex": "\\S",
            "message": "버튼 글자를 입력해 주세요."
          },
          "options": {
            "maxlength": 100
          }
        },
        {
          "name": "bookingUrl",
          "label": "스마트스토어 예약 주소",
          "type": "string",
          "description": "https://로 시작하는 주소를 복사해 붙여넣으세요. 비워두면 예약 버튼은 작동하지 않습니다.",
          "pattern": {
            "regex": "^(?:https://[^\\s/@?#]+(?:[/?#][^\\s]*)?)?$",
            "message": "https://로 시작하는 올바른 예약 주소를 입력해 주세요."
          },
          "options": {
            "maxlength": 2000
          }
        }
      ]
    }
  ],
  "settings": {
    "hide": true
  }
}
